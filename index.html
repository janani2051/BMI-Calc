
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>BMI Calculator</h1>
        <p class="subtitle">
            Understand your Body Mass Index
        </p>

        
<form id="bmiForm">
    <label for="unitSystem">Choose Units</label>
    <select id="unitSystem">
        <option value="metric">Metric (cm, kg)</option>
        <option value="imperial">Imperial (ft, in, lb)</option>
    </select>

    <div id="metricInputs">
        <label for="height">Height (cm)</label>
        <input type="number" id="height"
               placeholder="Enter height in cm"
               min="50" max="300" step="any">

        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight"
               placeholder="Enter weight in kg"
               min="1" max="700" step="any">
    </div>

    <div id="imperialInputs" hidden>
        <label for="heightFeet">Height (feet)</label>
        <input type="number" id="heightFeet"
               placeholder="Example: 5" min="0" max="9">

        <label for="heightInches">Additional inches</label>
        <input type="number" id="heightInches"
               placeholder="Example: 8" min="0" max="11" step="any">

        <label for="weightPounds">Weight (pounds)</label>
        <input type="number" id="weightPounds"
               placeholder="Enter weight in lb" min="1" max="1543" step="any">
    </div>

    <button type="submit">Calculate BMI</button>
</form>


        <div id="result" aria-live="polite"></div>
        

<div id="bmiGauge" class="bmi-gauge" hidden>
    <div class="gauge-track">
        <div id="gaugeMarker" class="gauge-marker"></div>
    </div>
    <div class="gauge-labels">
        <span>Underweight</span>
        <span>Normal</span>
        <span>Overweight</span>
        <span>Obesity</span>
    </div>
</div>

        
        
<section class="history-section">
    <h2>BMI History</h2>
    <p class="history-subtitle">Your previous calculations</p>

    <div id="historyList"></div>

    <button type="button" id="clearHistory" class="clear-button">
        Clear History
    </button>
</section>

    </div>

    <script src="script.js"></script>
</body>
</html>
